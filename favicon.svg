<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="6" fill="#0a0d0a"/>

  <!-- antenna -->
  <line x1="16" y1="4" x2="16" y2="8" stroke="#ffb347" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="16" cy="3.4" r="1.6" fill="#ffb347"/>

  <!-- head -->
  <rect x="7" y="8" width="18" height="14" rx="3" fill="none" stroke="#7fd858" stroke-width="1.8"/>

  <!-- eyes -->
  <circle cx="12.5" cy="15" r="2" fill="#7fd858"/>
  <circle cx="19.5" cy="15" r="2" fill="#7fd858"/>

  <!-- mouth / readout line -->
  <line x1="11" y1="19" x2="21" y2="19" stroke="#7fd858" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- side antennae / sensors -->
  <line x1="7" y1="13" x2="4" y2="13" stroke="#ffb347" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="25" y1="13" x2="28" y2="13" stroke="#ffb347" stroke-width="1.4" stroke-linecap="round"/>
</svg>
